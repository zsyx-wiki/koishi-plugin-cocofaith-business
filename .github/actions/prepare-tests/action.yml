name: Prepare test dependencies
description: Install declared dependencies and build release-matched CoCoFaith test implementations.
inputs:
  sdk-ref:
    description: SDK source revision used by tests
    default: main
  core-ref:
    description: Core source revision used by tests
    default: main
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false
    - name: Check out SDK test implementation
      uses: actions/checkout@v6
      with:
        repository: zsyx-wiki/cocofaith-sdk
        ref: ${{ inputs.sdk-ref }}
        path: .test-deps/sdk
        persist-credentials: false
    - name: Build SDK test implementation
      shell: bash
      run: |
        npm install --prefix .test-deps/sdk
        npm run build --prefix .test-deps/sdk
    - name: Check out Core test implementation
      uses: actions/checkout@v6
      with:
        repository: zsyx-wiki/koishi-plugin-cocofaith-core
        ref: ${{ inputs.core-ref }}
        path: .test-deps/core
        persist-credentials: false
    - name: Build Core test implementation
      shell: bash
      run: |
        npm install --prefix .test-deps/core --no-save --package-lock=false "$GITHUB_WORKSPACE/.test-deps/sdk"
        npm run build --prefix .test-deps/core
    - name: Install package and test dependencies
      shell: bash
      run: npm install --no-save --package-lock=false "$GITHUB_WORKSPACE/.test-deps/sdk" "$GITHUB_WORKSPACE/.test-deps/core"
